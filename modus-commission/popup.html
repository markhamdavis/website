<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Modus- Commission</title>
<style>
  body { width: 280px; margin: 0; padding: 14px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #1f2328; }
  h1 { font-size: 15px; margin: 0 0 10px; color: #145a37; }
  label { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; cursor: pointer; }
  p { color: #57606a; margin: 6px 0; }
  button { border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  .key span { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; border: 2px solid; }
</style>
</head>
<body>
  <h1>Modus- Commission</h1>
  <label><input type="checkbox" id="enabled"> Show commission boxes</label>
  <div class="key">
    <p><span style="border-color:#1f7a4d;background:#e9f7ef"></span>Confident match</p>
    <p><span style="border-color:#b7791f;background:#fff8e6"></span>Check it (click the box)</p>
    <p><span style="border-color:#2b5cb8;background:#edf3ff"></span>Your manual pick</p>
    <p><span style="border-color:#9aa0a6;background:#f3f4f6"></span>No match found</p>
  </div>
  <p id="count"></p>
  <button id="clear">Clear manual picks</button>
  <p>Comp grid: Brokers Alliance, pulled Sept 24, 2026. First-year %; subject to change.</p>
  <script src="popup.js"></script>
</body>
</html>
